# Projects (shown on homepage)
projects:
  - name: "Popper's Knowledge Tensor"
    description: "A neuro-symbolic framework exploring hard falsification as an alternative to soft constraint satisfaction — blending Popper's epistemology with tensor-based knowledge representation."
    url: /popper/
    tag: epistemology + AI
  - name: "Rube Goldberg AI"
    description: "Is it a silly way to learn a hard thing, or a hard way to learn a silly thing? An exploration of play, serendipity, and whether AI can learn to do things the hard way on purpose."
    url: /rube-goldberg/
    tag: AI + play
  - name: "AI in the Garden"
    description: "From plant diagnostics to micro-drones — what happens when AI moves from the digital world into the soil, weather, and living systems of a real garden."
    url: /ai-garden/
    tag: AI + physical world
  - name: "All Security Is Theater"
    description: "Security is a feeling, not a state — and AI is about to stress-test both sides. On locks, gas cutters, and the symmetric arms race in cybersecurity."
    url: /ai-security/
    tag: AI + security
  - name: "Two Ways of Knowing"
    description: "Rationalism only tells half the story. What happens when your formal epistemology project and your rooftop garden start arguing with each other."
    url: /ways-of-knowing/
    tag: epistemology + intuition
