<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
<link rel="canonical" href="https://raveenb.github.io{{ page.url | replace: 'index.html', '' }}" />

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "{{ site.title }}",
      "url": "https://raveenb.github.io",
      "description": "{{ site.description }}"
    },
    {
      "@type": "Person",
      "@id": "https://raveenb.github.io/#author",
      "name": "{{ site.author.name }}",
      "url": "https://raveenb.github.io",
      "description": "{{ site.author.bio }}"
    }
    {% if page.layout == 'default' and page.title %}
    ,{
      "@type": "Article",
      "headline": "{{ page.title }}",
      "description": "{{ page.description | default: site.description }}",
      "url": "https://raveenb.github.io{{ page.url | replace: 'index.html', '' }}",
      "author": { "@id": "https://raveenb.github.io/#author" },
      "publisher": { "@id": "https://raveenb.github.io/#author" }
    }
    {% endif %}
  ]
}
</script>

<!-- MathJax 3 — inline $...$ and display $$...$$ -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>
