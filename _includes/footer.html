<footer class="site-footer">
  <div class="container">
    &copy; {{ site.time | date: "%Y" }} {{ site.author.name | default: site.title }}
  </div>
</footer>

<script>
  document.querySelectorAll('a[href^="http"]').forEach(function(a) {
    if (a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
</script>
